name: "selftesting"
on:
  issue_comment:
    types: created

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: 'stable'
    - name: Install Dependencies
      run: sudo apt-get install --no-install-recommends -yq valgrind
    - uses: ./
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
